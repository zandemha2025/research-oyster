name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oyster
          POSTGRES_PASSWORD: oyster
          POSTGRES_DB: gaming_pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oyster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://oyster:oyster@localhost:5432/gaming_pulse

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Migrate database
        run: python main.py migrate

      - name: Run Python test suite
        run: python -m pytest tests/ -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run browser-extension tests
        run: node --test browser_extension/tests/core.test.js
